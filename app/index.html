<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMI Scanner</title>
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="firebase-config.js"></script>
<script>
  // apply the saved theme before first paint (no flash)
  try { const t = localStorage.getItem("kmi.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f2; --card: #ffffff; --ink: #141a17; --ink-2: #3f4a44; --muted: #66736c; --line: #e3e6e2;
  --brand: #0f6b4f; --brand-ink: #ffffff; --brand-soft: #e3f1eb;
  --good: #1a7f45; --bad: #c0392b; --warn: #a86a10;
  --chip-buy: #0f6b4f; --chip-run: #a86a10; --chip-fade: #8a3b3b; --chip-none: #7d8781; --chip-plan: #2b5d8a;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --grid: #e1e0d9; --axis: #898781; --stop: #d03b3b; --target: #0ca30c; --entry: #141a17;
  --radius: 16px; --shadow: 0 1px 2px rgba(20, 26, 23, .06), 0 2px 8px rgba(20, 26, 23, .04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f1412; --card: #182019; --ink: #e8eee9; --ink-2: #c3cdc6; --muted: #93a199; --line: #26302a;
    --brand: #34a57a; --brand-ink: #07130d; --brand-soft: #16291f;
    --good: #4cc27f; --bad: #ef6b5b; --warn: #e3a948;
    --chip-buy: #2f9c72; --chip-run: #b8862e; --chip-fade: #a85252; --chip-none: #5f6b65; --chip-plan: #3f7bb3;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --grid: #2c2c2a; --axis: #898781; --stop: #e05a5a; --target: #0ca30c; --entry: #e8eee9;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1412; --card: #182019; --ink: #e8eee9; --ink-2: #c3cdc6; --muted: #93a199; --line: #26302a;
  --brand: #34a57a; --brand-ink: #07130d; --brand-soft: #16291f;
  --good: #4cc27f; --bad: #ef6b5b; --warn: #e3a948;
  --chip-buy: #2f9c72; --chip-run: #b8862e; --chip-fade: #a85252; --chip-none: #5f6b65; --chip-plan: #3f7bb3;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --grid: #2c2c2a; --axis: #898781; --stop: #e05a5a; --target: #0ca30c; --entry: #e8eee9;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
a { color: var(--brand); }
header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-ink);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
header .bar { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 17px; margin: 0; flex: 1; letter-spacing: .01em; }
header .sub { max-width: 720px; margin: 2px auto 0; font-size: 12px; opacity: .92; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .16);
  color: inherit; font-size: 17px; cursor: pointer; display: grid; place-items: center; }
.iconbtn:active { transform: scale(.96); }
.iconbtn.spin span { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); }
nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav a { flex: 1; text-align: center; padding: 8px 2px 9px; font-size: 11.5px; color: var(--muted); text-decoration: none; }
nav a .ico { display: block; font-size: 18px; line-height: 1.2; }
nav a.on { color: var(--brand); font-weight: 650; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin: 10px 0; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
h2 { font-size: 16px; margin: 4px 0 8px; }
h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 6px; }
.section-title h2 { margin: 0; font-size: 15px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 12px;
  font-weight: 650; color: #fff; white-space: nowrap; }
.chip.buy_plan { background: var(--chip-buy); } .chip.running { background: var(--chip-run); }
.chip.fading { background: var(--chip-fade); } .chip.no_setup { background: var(--chip-none); }
.chip.in_plan { background: var(--chip-plan); }
.dots { display: flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
.dot.on { background: var(--good); }
.up { color: var(--good); } .down { color: var(--bad); }
/* today's plan cards */
.plan-card { border: 1px solid var(--line); border-left: 5px solid var(--chip-buy); }
.plan-card .sym { font-size: 19px; font-weight: 750; letter-spacing: .01em; }
.plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
.plan-grid div { background: var(--bg); border-radius: 10px; padding: 7px 8px; min-width: 0; }
.plan-grid b { display: block; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.plan-grid span { font-size: 11px; color: var(--muted); }
/* compact stock rows */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.list a.item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; color: inherit; text-decoration: none;
  border-top: 1px solid var(--line); }
.list a.item:first-child { border-top: 0; }
.list .who { flex: 1; min-width: 0; }
.list .who b { font-size: 14.5px; }
.list .who .name { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .px { text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.banner { border-radius: var(--radius); padding: 14px; color: #fff; margin: 10px 0; }
.banner.buy_plan { background: var(--chip-buy); } .banner.running { background: var(--chip-run); }
.banner.fading { background: var(--chip-fade); } .banner.no_setup { background: var(--chip-none); }
.banner.in_plan { background: var(--chip-plan); }
.check { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.ok { color: var(--good); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; }
input, select, button { font: inherit; }
input[type=number], input[type=text], input[type=date], select { width: 100%; padding: 10px 11px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); }
label.field { display: block; margin: 8px 0; font-size: 13px; color: var(--muted); }
label.tick { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
label.tick input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--brand); }
.btn { display: inline-block; padding: 12px 16px; border-radius: 12px; border: 0; background: var(--brand);
  color: var(--brand-ink); font-weight: 650; text-decoration: none; cursor: pointer; text-align: center; }
.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.note { border-left: 3px solid var(--warn); padding: 9px 11px; background: var(--card); border-radius: 10px;
  font-size: 13px; margin: 10px 0; }
.lock { border-left-color: var(--bad); }
.bar-p { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-p > div { height: 100%; background: var(--brand); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 14px; }
.kv div:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
pre { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 8px; }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.loading { text-align: center; padding: 40px 12px; color: var(--muted); }
.back { display: inline-block; font-size: 13px; text-decoration: none; padding: 4px 0; }
details summary { cursor: pointer; color: var(--brand); font-size: 13px; margin-top: 8px; }
/* chart */
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.seg button.on { background: var(--brand-soft); color: var(--ink); font-weight: 650; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 8px 0 4px; }
.legend .k { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend .k.dash { border-top-style: dashed; }
.chart-box { position: relative; touch-action: pan-y; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart-box text.lvl { fill: var(--ink-2); font-weight: 600; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); white-space: nowrap; display: none; }
.tip .d { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r .k { width: 12px; border-top: 2px solid; }
/* daily tip, above the menu */
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 6;
  max-width: 696px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--brand);
  border-radius: 14px; padding: 11px 40px 10px 13px; box-shadow: 0 6px 24px rgba(0, 0, 0, .16); font-size: 13.5px; }
.toast .t-title { font-weight: 700; font-size: 12px; color: var(--brand); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.toast .t-actions { display: flex; gap: 14px; margin-top: 6px; font-size: 12.5px; }
.toast .t-actions button { border: 0; background: none; color: var(--brand); padding: 4px 0; cursor: pointer; font-weight: 600; }
.toast .t-actions button.quiet { color: var(--muted); font-weight: 400; }
.toast .x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; background: none;
  color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 8px; }
main.has-toast { padding-bottom: calc(190px + env(safe-area-inset-bottom)); }
/* welcome pop-up */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end;
  justify-content: center; padding: 16px; }
@media (min-width: 560px) { .overlay { align-items: center; } }
.modal { background: var(--card); color: var(--ink); border-radius: 20px; width: 100%; max-width: 520px; max-height: 86vh;
  overflow-y: auto; padding: 18px 18px 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
.modal h2 { font-size: 18px; margin: 0 0 4px; }
.gloss { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: start; margin: 12px 0; }
.gloss .chip { margin-top: 1px; }
.gloss p { margin: 0; font-size: 13.5px; }
.gloss p b { display: block; font-size: 13.5px; }
.help-sec { margin-top: 4px; }
.help-sec dt { font-weight: 650; margin-top: 10px; }
.help-sec dd { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--brand); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>KMI Scanner</h1>
    <a class="iconbtn" href="#help" title="Help guide" aria-label="Help guide" style="text-decoration:none;font-weight:700">?</a>
    <button class="iconbtn" id="refresh" title="Refresh" aria-label="Refresh data"><span>↻</span></button>
    <button class="iconbtn" id="theme" title="Light / dark" aria-label="Switch light or dark mode">◐</button>
  </div>
  <div class="sub" id="sub">Loading…</div>
</header>
<main id="view"><div class="loading">Loading today's signals…</div></main>
<div id="toast-slot"></div>
<div id="modal-slot"></div>
<nav id="nav">
  <a href="#hot" data-r="hot"><span class="ico">◎</span>Today</a>
  <a href="#log" data-r="log"><span class="ico">✎</span>My trades</a>
  <a href="#record" data-r="record"><span class="ico">▤</span>Track record</a>
  <a href="#settings" data-r="settings"><span class="ico">⚙</span>Settings</a>
</nav>
<script>
"use strict";
// ---------- storage (per device; the page works without it) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("kmi." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kmi." + k, JSON.stringify(v)); } catch {} },
};
const settings = () => ({ risk: 2000, dailyLoss: 6000, minPrice: 0, maxPrice: 0, minValue: 2000000,
                          ...store.get("settings", {}) });
const trades = () => store.get("trades", []);
const saveTrades = (t) => store.set("trades", t);

// ---------- costs: same formula as backtest.py (AKD Trade tiers) ----------
const sideCost = (price) => (price < 5 ? 0.03 / price : Math.max(0.0015, 0.05 / price)) * 1.15 + 0.00009;
function tradePKR(t) {
  const buy = t.entry * t.shares, sell = t.exit * t.shares;
  return sell - buy - buy * sideCost(t.entry) - sell * sideCost(t.exit);
}

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pkr = (x) => x == null ? "–" : (x < 0 ? "−" : "") + "PKR " + Math.abs(Math.round(x)).toLocaleString("en-PK");
const rs = (x) => x == null ? "–" : "Rs " + Number(x).toLocaleString("en-PK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num2 = (x) => x == null ? "–" : Number(x).toLocaleString("en-PK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const signPct = (x) => x == null ? "" : (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1) + "%";
const today = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Karachi" });
const fmtDay = (iso) => { const d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };
const STATUS_LABEL = { buy_plan: "Buy plan", in_plan: "Plan active", running: "Running", fading: "Fading", no_setup: "No setup" };
const STATUS_ICON = { buy_plan: "▲", in_plan: "●", running: "↗", fading: "↘", no_setup: "–" };
const ORDER = { buy_plan: 0, in_plan: 1, running: 2, fading: 3, no_setup: 4 };
const chip = (s) => `<span class="chip ${s}"><span aria-hidden="true">${STATUS_ICON[s]}</span>${STATUS_LABEL[s]}</span>`;

let DATA = null, LEDGER = null, STATUS = null, RESEARCH = null, LOAD_ERROR = null;
const HIST = {};
async function load() {
  // a fresh query string on every load: GitHub Pages lets browsers cache files for 10 minutes
  const stamp = Date.now();
  const get = (f) => fetch(`data/${f}?t=${stamp}`, { cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null);
  [DATA, LEDGER, STATUS] = await Promise.all([get("signals.json"), get("ledger.json"), get("status.json")]);
  RESEARCH = null;
  for (const k in HIST) delete HIST[k];
  LOAD_ERROR = DATA ? null : "Couldn't load today's signals. Check your connection, then tap ↻.";
  const sub = document.getElementById("sub");
  if (!DATA) { sub.textContent = "Offline or no data yet"; return; }
  sub.textContent = `Prices of ${fmtDay(DATA.as_of)} close · KMI All Share list of ${fmtDay(DATA.kmi_list_date)}`;
}

// ---------- risk rules (Step 8) ----------
function riskState() {
  const s = settings(), all = trades(), closed = all.filter((t) => t.exit != null);
  const t0 = today();
  const todayPKR = closed.filter((t) => t.exitDate === t0).reduce((a, t) => a + tradePKR(t), 0);
  let streak = 0;
  for (const t of [...closed].sort((a, b) => (b.exitDate + b.id).localeCompare(a.exitDate + a.id))) {
    if (tradePKR(t) <= 0) streak++; else break;
  }
  const lastLossToday = closed.some((t) => t.exitDate === t0 && tradePKR(t) <= 0);
  const reasons = [];
  if (todayPKR <= -s.dailyLoss) reasons.push(`Daily loss lock: today's result is ${pkr(todayPKR)}, your limit is ${pkr(s.dailyLoss)}. No new trades until tomorrow.`);
  if (streak >= 3 && lastLossToday) reasons.push(`${streak} losses in a row: done for the day.`);
  return { todayPKR, streak, blocked: reasons.length > 0, reasons, closed: closed.length };
}

// ---------- screens ----------
function planHero(x) {
  const p = x.plans[0], s = settings();
  const ref = p.order_price || x.close;
  const pos = s.risk / p.stop_pct, shares = Math.floor(pos / ref);
  return `
  <div class="card plan-card">
    <div class="row between">
      <div style="min-width:0"><div class="sym">${esc(x.symbol)}</div>
        <div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.name || "")}</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:650">${rs(x.close)}</div>
        <div class="small ${x.change_pct >= 0 ? "up" : "down"}">${signPct(x.change_pct)}</div></div>
    </div>
    <div class="small" style="margin-top:8px"><b>${esc(p.setup_label)}</b> · ${esc(p.order)}</div>
    <div class="plan-grid">
      <div><span>Stop</span><b>${num2(ref * (1 - p.stop_pct))}</b><span>−${pct(p.stop_pct, 0)}</span></div>
      <div><span>Target</span><b>${p.target_pct ? num2(ref * (1 + p.target_pct)) : "none"}</b><span>${p.target_pct ? "+" + pct(p.target_pct, 0) : "hold " + p.max_hold_days + "d"}</span></div>
      <div><span>Shares</span><b>${shares.toLocaleString()}</b><span>risk ${pkr(s.risk).replace("PKR ", "Rs ")}</span></div>
    </div>
    <div class="row" style="gap:8px">
      <a class="btn ghost" style="flex:1" href="#stock/${esc(x.symbol)}">Details & chart</a>
      <a class="btn" style="flex:1" href="#check/${esc(x.symbol)}">Pre-trade check</a>
    </div>
  </div>`;
}

function hot() {
  if (!DATA) return `<div class="empty">${esc(LOAD_ERROR || "No signals yet.")}</div>`;
  const s = settings(), f = store.get("filter", "all"), q = store.get("q", "");
  const tested = Object.keys(DATA.tested_setups || {}).length;
  const plans = DATA.stocks.filter((x) => x.status === "buy_plan" && !x.stale)
    .sort((a, b) => (b.traded_value_pkr || 0) - (a.traded_value_pkr || 0));
  let list = DATA.stocks.filter((x) => !x.stale && x.status !== "buy_plan");
  if (s.minPrice) list = list.filter((x) => x.close >= s.minPrice);
  if (s.maxPrice) list = list.filter((x) => x.close <= s.maxPrice);
  if (s.minValue) list = list.filter((x) => (x.traded_value_pkr || 0) >= s.minValue || x.status === "in_plan");
  if (f !== "all") list = list.filter((x) => x.status === f);
  if (q) list = list.filter((x) => (x.symbol + " " + (x.name || "")).toLowerCase().includes(q.toLowerCase()));
  list.sort((a, b) => ORDER[a.status] - ORDER[b.status] || (b.traded_value_pkr || 0) - (a.traded_value_pkr || 0));
  const counts = {}; DATA.stocks.forEach((x) => counts[x.status] = (counts[x.status] || 0) + 1);
  const live = DATA.alerts_made;
  return `
  ${tested ? "" : `<div class="note lock">No setup has passed the backtest, so there are no Buy plans. Everything shown is for context only.</div>`}

function chartLevels(x) {
  const ap = x.active_plan, out = [];
  if (x.status === "buy_plan" && x.plans.length) {

    out.push({ v: ref, label: p.order_type === "limit" ? "Buy" : "Buy≈", cls: "entry" });
    out.push({ v: ref * (1 - p.stop_pct), label: "Stop", cls: "stop" });
    if (p.target_pct) out.push({ v: ref * (1 + p.target_pct), label: "Target", cls: "target" });
  } else if (ap && ap.result && ap.result.fill_price) {
    out.push({ v: ap.result.fill_price, label: "Bought", cls: "entry" });
    out.push({ v: ap.result.stop_price, label: "Stop", cls: "stop" });
    if (ap.result.target_price) out.push({ v: ap.result.target_price, label: "Target", cls: "target" });
  }
  return out;
}

// ---------- price chart ----------
async function loadHistory(sym) {
  if (HIST[sym]) return HIST[sym];
  const r = await fetch(`daily/${encodeURIComponent(sym)}.csv?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error("no price history");
  const lines = (await r.text()).trim().split(/\r?\n/);
  const head = lines[0].split(",");
  const di = head.indexOf("date"), ci = head.indexOf("close");
  const rows = [];
  for (const line of lines.slice(1)) {
    const p = line.split(",");
    const c = parseFloat(p[ci]);
    if (c > 0) rows.push({ d: p[di].slice(0, 10), c });
  }
  // averages over the full history, as the engine computes them
  const sma = (n) => { let s = 0; return rows.map((r, i) => { s += r.c; if (i >= n) s -= rows[i - n].c; return i >= n - 1 ? s / n : null; }); };
  const s20 = sma(20), s50 = sma(50);
  rows.forEach((r, i) => {
    r.s20 = s20[i]; r.s50 = s50[i];
    const prev = i ? rows[i - 1].c : null;
    // a move bigger than the circuit limit can't be a trade: split, bonus or data gap
    r.brk = !!prev && Math.abs(r.c / prev - 1) > Math.max(0.10, 1 / prev) + 0.01;
  });
  return HIST[sym] = rows;
}

function niceStep(span, target) {
  const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag;
  return (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1 ? 2 : 1) * mag;
}

const SERIES = [
  { key: "c", name: "Close", color: "var(--series-1)", w: 2 },
  { key: "s20", name: "20-day avg", color: "var(--series-2)", w: 1.5 },
  { key: "s50", name: "50-day avg", color: "var(--series-3)", w: 1.5 },
];
const LEVEL_COLOR = { entry: "var(--entry)", stop: "var(--stop)", target: "var(--target)" };

function drawChart(box, all, levels, n) {
  let data = all.slice(-n);
  // unadjusted prices can't be compared across a split or bonus issue, so
  // start after the most recent one (and keep averages only once they're clean)
  let cut = -1;
  data.forEach((r, i) => { if (r.brk) cut = i; });
  if (cut > 0) {
    data = data.slice(cut).map((r, i) => ({ ...r, s20: i >= 19 ? r.s20 : null, s50: i >= 49 ? r.s50 : null }));
  }
  box.dataset.cut = cut > 0 ? data[0].d : "";
  if (data.length < 2) { box.innerHTML = `<div class="empty">Not enough price history since the last split or bonus issue.</div>`; return; }
  const W = Math.max(280, Math.round(box.clientWidth || 340)), H = 230;
  const L = 6, R = 64, T = 10, B = 22;
  const vals = [];
  data.forEach((r) => SERIES.forEach((s) => r[s.key] != null && vals.push(r[s.key])));
  levels.forEach((l) => vals.push(l.v));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo) * 0.06 || hi * 0.05 || 1; lo = Math.max(0, lo - padv); hi += padv;
  const X = (i) => L + i * (W - L - R) / (data.length - 1);
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = niceStep(hi - lo, 4);
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    v = Math.round(v / step) * step || 0;         // no float drift, no "-0"
    const y = Y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    // skip a tick label that would sit on a plan level line
    if (!levels.some((l) => Math.abs(Y(l.v) - (+y - 6)) < 9))
      g += `<text x="${L + 2}" y="${(+y - 3).toFixed(1)}">${num2(v).replace(/\.00$/, "")}</text>`;
  }
  // month labels, at least 48px apart
  let lastX = -99, lastM = "";
  data.forEach((r, i) => {
    const m = r.d.slice(0, 7);
    if (m !== lastM) {
      lastM = m;
      const x = X(i);
      if (i > 0 && x - lastX >= 48 && x < W - R - 14) {
        g += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle">${new Date(r.d + "T00:00:00").toLocaleDateString("en-GB", { month: "short" })}</text>`;
        lastX = x;
      }
    }
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--axis)" stroke-width="1"/>`;
  // splits / bonus issues: the prices aren't adjusted, so mark the jump
  data.forEach((r, i) => {
    if (r.brk && i > 0) {
      const x = X(i).toFixed(1);
      g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" stroke-dasharray="2 3"/>`;
      g += `<text x="${(+x + 3).toFixed(1)}" y="${T + 9}">split/bonus?</text>`;
    }
  });
  // series
  SERIES.slice().reverse().forEach((s) => {
    let d = "", pen = false;
    data.forEach((r, i) => {
      const v = r[s.key];
      if (v == null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
      pen = true;
    });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // plan levels, labelled at the right (text in ink, the line carries the colour)
  const placed = [];
  levels.slice().sort((a, b) => b.v - a.v).forEach((l) => {
    const y = Y(l.v);
    g += `<line x1="${L}" x2="${W - R + 4}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${LEVEL_COLOR[l.cls]}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    let ty = y + 3.5;
    while (placed.some((p) => Math.abs(p - ty) < 12)) ty += 12;
    placed.push(ty);
    g += `<text class="lvl" x="${W - R + 8}" y="${ty.toFixed(1)}">${esc(l.label)} ${num2(l.v)}</text>`;
  });
  // last close, labelled at the right if no plan levels sit there
  const last = data[data.length - 1], ly = Y(last.c) + 3.5;
  if (!placed.some((p) => Math.abs(p - ly) < 12)) g += `<text x="${W - R + 8}" y="${ly.toFixed(1)}">${num2(last.c)}</text>`;
  g += `<line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  g += `<circle id="xd" r="4" fill="var(--series-1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price chart, last ${data.length} trading days">${g}</svg><div class="tip" id="tip"></div>`;

  // crosshair + tooltip (snaps to the nearest trading day)
  const svg = box.querySelector("svg"), tip = box.querySelector("#tip");
  const xh = svg.querySelector("#xh"), xd = svg.querySelector("#xd");
  const show = (clientX) => {
    const rect = svg.getBoundingClientRect(), sx = (clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(data.length - 1, Math.round((sx - L) * (data.length - 1) / (W - L - R))));
    const r = data[i], x = X(i);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", x); xd.setAttribute("cy", Y(r.c)); xd.setAttribute("visibility", "visible");
    tip.replaceChildren();
    const day = document.createElement("div"); day.className = "d"; day.textContent = fmtDay(r.d); tip.appendChild(day);
    SERIES.forEach((s) => {
      const row = document.createElement("div"); row.className = "r";
      const k = document.createElement("span"); k.className = "k"; k.style.borderColor = s.color;
      const b = document.createElement("b"); b.textContent = num2(r[s.key]);
      const n = document.createElement("span"); n.className = "muted"; n.textContent = s.name;
      row.append(k, b, n); tip.appendChild(row);
    });
    tip.style.display = "block";
    const px = x * rect.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(rect.width - tw, px + (px > rect.width / 2 ? -tw - 12 : 12))) + "px";
  };
  const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); xd.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", (e) => show(e.clientX));
  svg.addEventListener("pointerdown", (e) => show(e.clientX));
  svg.addEventListener("pointerleave", hide);
  return data;
}

async function renderChart(x) {
  const box = document.getElementById("chart");
  if (!box) return;
  const levels = chartLevels(x);
  const legend = document.getElementById("legend");
  try {
    const rows = await loadHistory(x.symbol);
    if (!document.body.contains(box)) return;
    const n = store.get("range", 126);
    const drawn = drawChart(box, rows, levels, n);
    const last = drawn ? drawn[drawn.length - 1] : rows[rows.length - 1];
    legend.innerHTML = SERIES.map((s) => `<span><span class="k" style="border-color:${s.color}"></span>${s.name} <b class="num">${num2(last[s.key])}</b></span>`).join("") +
      levels.map((l) => `<span><span class="k dash" style="border-color:${LEVEL_COLOR[l.cls]}"></span>${esc(l.label)} <b class="num">${num2(l.v)}</b></span>`).join("");
    if (box.dataset.cut) {
      const note = document.createElement("p");
      note.className = "small muted"; note.style.margin = "6px 0 0";
      note.textContent = `Chart starts at the split or bonus issue on ${fmtDay(box.dataset.cut)}: PSX prices aren't adjusted, so earlier prices aren't comparable.`;
      box.appendChild(note);
    }
    const shown = rows.slice(-n).slice(-20).reverse();
    document.getElementById("chart-rows").innerHTML = `<table><tr><th>Date</th><th class="num">Close</th><th class="num">20-day</th><th class="num">50-day</th></tr>
      ${shown.map((r) => `<tr><td>${esc(r.d)}</td><td class="num">${num2(r.c)}</td><td class="num">${num2(r.s20)}</td><td class="num">${num2(r.s50)}</td></tr>`).join("")}</table>
      <p class="small muted">Last 20 trading days. Prices are not adjusted for bonus shares or splits.</p>`;
  } catch {
    box.innerHTML = `<div class="empty">Price history isn't available yet. It appears after the next daily run.</div>`;
  }
}

  const ref = p.order_price || x.close;
  const shares = Math.floor((s.risk / p.stop_pct) / ref);
  const n = r.closed % 20;
  return `
  <a href="#stock/${esc(sym)}" class="back">← ${esc(sym)}</a>

function logView() {
  const all = trades(), r = riskState();
  const closed = all.filter((t) => t.exit != null).sort((a, b) => (a.exitDate + a.id).localeCompare(b.exitDate + b.id));
  const open = all.filter((t) => t.exit == null);
  const blocks = [];
  for (let i = 0; i < closed.length; i += 20) {
    const b = closed.slice(i, i + 20), sum = b.reduce((a, t) => a + tradePKR(t), 0);

async function render() {
  const [route, arg] = (location.hash.slice(1) || "hot").split("/");
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.r === route || (route === "stock" || route === "check") && a.dataset.r === "hot"));
  const v = document.getElementById("view");
  const screens = { hot, stock: () => stock(arg), check: () => check(arg), log: logView, record,
                    settings: settingsView, about, status, research, help };
  v.innerHTML = fcmBanner() + await (screens[route] || hot)();
  if (store.get("lastRoute", "") !== location.hash) window.scrollTo(0, 0);
  store.set("lastRoute", location.hash);
  wire(route, arg);
}

function wire(route, arg) {
  const $ = (id) => document.getElementById(id);
  if (route === "hot" || !route) {
    $("f") && ($("f").onchange = (e) => { store.set("filter", e.target.value); render(); });
    $("q") && ($("q").onchange = (e) => { store.set("q", e.target.value.trim()); render(); });
  }
  if (route === "stock" && DATA) {
    const x = DATA.stocks.find((s) => s.symbol === arg);
    if (x) {
      renderChart(x);
      document.querySelectorAll("[data-range]").forEach((b) => b.onclick = () => {
        store.set("range", +b.dataset.range);
        document.querySelectorAll("[data-range]").forEach((o) => o.classList.toggle("on", o === b));
        renderChart(x);
      });
    }
  }
  if (route === "check") {
    const boxes = [...document.querySelectorAll("input.c")], btn = $("in");
    if (!btn) return;
    const blocked = riskState().blocked;
    const upd = () => btn.disabled = blocked || !boxes.every((b) => b.checked);
    boxes.forEach((b) => b.onchange = upd);
    btn.onclick = () => {
      const x = DATA.stocks.find((s) => s.symbol === arg), p = x.plans[0];
      const entry = parseFloat($("fill").value), shares = parseInt($("shares").value, 10);
      if (!(entry > 0 && shares > 0)) return alert("Enter your fill price and shares.");
      const all = trades();
      all.push({ id: Date.now().toString(36), symbol: arg, setup: p.setup_label, entry, shares,
        stop: +(entry * (1 - p.stop_pct)).toFixed(2), target: p.target_pct ? +(entry * (1 + p.target_pct)).toFixed(2) : null,
        entryDate: today(), exit: null, exitDate: null, followed: null, noChase: true });
      saveTrades(all);
      location.hash = "#log";
    };
  }
  if (route === "log") {
    document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => {
      const id = b.dataset.close, px = parseFloat($("x-" + id).value);
      if (!(px > 0)) return alert("Enter the exit price.");
      const all = trades(), t = all.find((t) => t.id === id);
      t.exit = px; t.exitDate = today(); t.followed = $("fp-" + id).value === "yes";
      saveTrades(all); render();
    });
  }
  if (route === "settings") {
    $("fcm-on").onclick = () => enableFcm($("fcm-out"));
    $("s-save").onclick = () => {
      store.set("settings", { risk: +$("s-risk").value || 2000, dailyLoss: +$("s-dl").value || 6000,
        minValue: +$("s-mv").value || 0, minPrice: +$("s-pmin").value || 0, maxPrice: +$("s-pmax").value || 0 });
      location.hash = "#hot";
    };
  }
  if (route === "help") {
    $("h-welcome").onclick = () => showWelcome(true);
  }
  if (route === "settings") {
    $("s-tips").onchange = (e) => { store.set("tipsOff", !e.target.checked); store.set("tipDismissed", ""); showTip(); };
  }
  if (route === "about") {
    const upd = () => $("pu-r").textContent = pkr((+$("pu-d").value || 0) * (+$("pu-p").value || 0) / 100);
    $("pu-d").oninput = upd; $("pu-p").oninput = upd;
  }
}

// ---------- Firebase push (Step 5) ----------
const FB = "https://www.gstatic.com/firebasejs/10.14.1/";
const loadScript = (src) => new Promise((ok, fail) => {
  if (document.querySelector(`script[src="${src}"]`)) return ok();
  const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail;
  document.head.appendChild(s);
});
async function enableFcm(out) {
  const say = (html) => out.innerHTML = html;
  try {
    if (!self.FIREBASE_CONFIG || !self.FIREBASE_CONFIG.apiKey || !self.FIREBASE_VAPID_KEY)
      return say("Firebase isn't set up yet: firebase-config.js is empty.");
    if (!("serviceWorker" in navigator) || !("Notification" in window))
      return say("This browser can't receive push alerts. Use Chrome on Android.");
    say("Asking for permission…");
    if (await Notification.requestPermission() !== "granted")
      return say("Notifications are blocked. Allow them in Chrome's site settings for this page, then try again.");
    await loadScript(FB + "firebase-app-compat.js");
    await loadScript(FB + "firebase-messaging-compat.js");
    if (!firebase.apps.length) firebase.initializeApp(self.FIREBASE_CONFIG);
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const token = await firebase.messaging().getToken({ vapidKey: self.FIREBASE_VAPID_KEY, serviceWorkerRegistration: reg });
    store.set("fcmToken", token);
    store.set("fcmChanged", false);
    say(`<b>Alerts are on for this device.</b> Copy this code and save it as the GitHub secret <code>FCM_TOKENS</code> (replace the old one):
      <textarea id="fcm-token" readonly style="width:100%;height:90px;margin-top:6px;font-size:11px">${esc(token)}</textarea>
      <button class="btn ghost wide" id="fcm-copy">Copy code</button>`);
    document.getElementById("fcm-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(token); document.getElementById("fcm-copy").textContent = "Copied"; }
      catch { document.getElementById("fcm-token").select(); }
    };
  } catch (e) {
    say("Couldn't turn on alerts: " + esc(e.message || e));
  }
}

// Chrome sometimes replaces a phone's push subscription; then the saved
// FCM_TOKENS code stops working. Check quietly on each visit.
async function checkFcmToken() {
  try {
    const saved = store.get("fcmToken", null);
    if (!saved || !("Notification" in window) || Notification.permission !== "granted" || !self.FIREBASE_CONFIG.apiKey) return;
    await loadScript(FB + "firebase-app-compat.js");
    await loadScript(FB + "firebase-messaging-compat.js");
    if (!firebase.apps.length) firebase.initializeApp(self.FIREBASE_CONFIG);
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const now = await firebase.messaging().getToken({ vapidKey: self.FIREBASE_VAPID_KEY, serviceWorkerRegistration: reg });
    if (now && now !== saved) {
      store.set("fcmToken", now);
      store.set("fcmChanged", true);
      render();
    }
  } catch {}
}

      <div class="plan-grid"><div><span>Stop</span><b>48.17</b><span>−12%</span></div>
        <div><span>Target</span><b>60.21</b><span>+10%</span></div>
        <div><span>Shares</span><b>304</b><span>risk Rs 2,000</span></div></div>

  return [
    { title: "Welcome to KMI Scanner", body: `
        <p>After every PSX close it checks all <b>KMI All Share</b> stocks (the halal-screened list; nothing outside it ever appears) and looks for two trade setups that passed years of honest testing.</p>
        <p>When one fires, you get a <b>Buy plan</b> on your phone: what to buy, at what price, where to stop out, where to take profit, and how many shares.</p>

}

function showWelcome(force = false) {
  if (!force && store.get("seenGuide", false)) return;
  const slot = document.getElementById("modal-slot");
  let steps = tutorialSteps();
  let i = 0;
  const saveRisk = () => {
    const el = document.getElementById("tut-risk");
    if (el && +el.value > 0) store.set("settings", { ...settings(), risk: Math.round(+el.value) });
  };
  const close = () => {
    saveRisk();
    store.set("seenGuide", true);
    slot.innerHTML = "";
    document.removeEventListener("keydown", onKey);
    showTip();
    render();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const draw = () => {
    steps = tutorialSteps();                     // rebuilt so the risk field shows the saved value
    const st = steps[i], last = i === steps.length - 1;
    slot.innerHTML = `
      <div class="overlay" id="w-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="w-title">
          <div class="row between" style="margin-bottom:6px">
            <span class="small muted">Step ${i + 1} of ${steps.length}</span>
            <button class="quiet" id="w-skip" style="border:0;background:none;color:var(--muted);cursor:pointer;padding:4px">${last ? "Close" : "Skip tour"}</button>
          </div>
          <h2 id="w-title">${st.title}</h2>
          <div style="font-size:14px">${st.body}</div>
          <div class="row" style="justify-content:center;gap:6px;margin:12px 0 4px" aria-hidden="true">
            ${steps.map((_, k) => `<span style="width:${k === i ? 18 : 7}px;height:7px;border-radius:99px;background:${k === i ? "var(--brand)" : "var(--line)"}"></span>`).join("")}
          </div>
          <div class="row" style="gap:8px;margin-top:8px">
            ${i > 0 ? `<button class="btn ghost" style="flex:1" id="w-back">Back</button>` : ""}
            <button class="btn" style="flex:2" id="w-next">${last ? "Start using the app" : "Next"}</button>
          </div>
          ${last ? `<a class="btn ghost wide" href="#settings" id="w-alerts">Go to Settings to turn on alerts</a>` : ""}
        </div>
      </div>`;
    const modal = slot.querySelector(".modal");
    modal.scrollTop = 0;
    document.getElementById("w-skip").onclick = close;
    document.getElementById("w-next").onclick = () => { saveRisk(); if (last) close(); else { i++; draw(); } };
    if (i > 0) document.getElementById("w-back").onclick = () => { saveRisk(); i--; draw(); };
    if (last) document.getElementById("w-alerts").onclick = close;
    document.getElementById("w-next").focus({ preventScroll: true });
  };
  document.addEventListener("keydown", onKey);
  draw();
}

function help() {
  return `
  <h2>Help guide</h2>
  <div class="card"><h2>Statuses</h2>${glossaryHTML()}</div>
  <div class="card"><h2>The four dots (lights)</h2>
    <dl class="help-sec">
      <dt>1 · Above 20-day average</dt><dd>Green when today's close is above the average of the last 20 closes.</dd>
      <dt>2 · Volume vs normal</dt><dd>Green when today's volume is at least the 20-day average volume.</dd>
      <dt>3 · KSE-100 trend</dt><dd>Green when the KSE-100 index is above its 50-day average.</dd>
      <dt>4 · Room to 60-day high</dt><dd>Green when the price is at least 5% below its 60-day high (room to rise before old highs).</dd>
    </dl>
    <p class="small muted">They explain the picture. They never create a Buy plan by themselves.</p></div>
  <div class="card"><h2>Reading a Buy plan</h2>
    <dl class="help-sec">
      <dt>Limit buy at Rs X</dt><dd>Enter a limit order at that price in AKD Trade. If the price never comes down to it, you don't buy, and that's fine.</dd>
      <dt>Buy at the opening price</dt><dd>Buy when the market opens. Skip it if the stock opens locked at its upper limit.</dd>
      <dt>Stop</dt><dd>Sell if the price falls this far below your fill. It caps the loss. If one day touches both stop and target, the record counts the stop.</dd>
      <dt>Target</dt><dd>Sell when the price rises this far above your fill. Trend hold has no fixed target.</dd>
      <dt>Max hold</dt><dd>If neither is hit, sell at the close after this many trading days.</dd>
      <dt>Shares</dt><dd>Worked out so that hitting the stop loses about your chosen risk (Settings, default PKR 2,000).</dd>
      <dt>Valid next session only</dt><dd>The plan is for the named day. After that session opens, a new plan is needed.</dd>
    </dl></div>
  <div class="card"><h2>The two tested setups</h2>
    <dl class="help-sec">
      <dt>Washout dip in a hot stock</dt><dd>A stock that ran up on heavy volume, then fell 30%+ from its recent high. Limit buy 1% under the close, +10% target, −12% stop, up to 15 days.</dd>
      <dt>Trend hold (weeks)</dt><dd>A new 60-day high while the 50-day average is above the 200-day average. Buy at the open, −15% stop, hold up to 60 days. Works in rising markets; loses in flat or falling ones.</dd>
    </dl></div>
  <div class="card"><h2>When things happen</h2>
    <dl class="help-sec">
      <dt>Daily scan</dt><dd>After every PSX close, about 17:00 Pakistan time (Mon–Fri), with a backup run at 07:30. New plans arrive as phone alerts.</dd>
      <dt>PSX hours</dt><dd>Mon–Thu 09:32–15:30; Friday 09:17–12:00 and 14:32–16:30. Closed on weekends and holidays.</dd>
      <dt>No plans today?</dt><dd>Normal. Most days have few or none.</dd>
    </dl></div>
  <div class="card"><h2>Track record and safety rules</h2>
    <dl class="help-sec">
      <dt>Track record</dt><dd>Every alert is locked when sent and graded from real prices after AKD's costs: filled or not, then stop, target or time exit.</dd>
      <dt>Pre-trade check</dt><dd>Three ticks before "I'm in": it's the tested setup, you accept the loss at the stop, you're not chasing.</dd>
      <dt>Daily loss lock</dt><dd>After your daily loss limit, new trades are blocked until tomorrow. Three losses in a row also end the day.</dd>
    </dl></div>
  <button class="btn ghost wide" id="h-welcome">Replay the tutorial</button>
  <p class="small"><a href="#about">About, halal screening and purification</a></p>`;
}

window.addEventListener("hashchange", render);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => {
  const [route, arg] = (location.hash.slice(1) || "hot").split("/");
  const x = route === "stock" && DATA && DATA.stocks.find((s) => s.symbol === arg);
  if (x) renderChart(x);
}, 200); });
load().then(render).then(() => { showWelcome(); showTip(); }).then(checkFcmToken);
</script>
